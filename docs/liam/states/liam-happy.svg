  <style>/* Every animated group has one transform owner. Face/head never scale. */
.luna2 { display:block; width:100%; height:auto; aspect-ratio:8/9; overflow:hidden; }
.luna2 * { transform-box:view-box; }
.luna2 .l2-outfit-enterprise,
.luna2 .l2-eyes-shut,.luna2 .l2-eyes-blink,.luna2 .l2-mouth-small,.luna2 .l2-mouth-wide,
.luna2 .l2-mouth-concern,.luna2 .l2-mouth-snore,.luna2 .l2-sleep-mask,.luna2 .l2-laptop,.luna2 .l2-effects &gt; g,
.luna2 .l2-hand-think,.luna2 .l2-listening-glow,.luna2 .l2-brows { opacity:0; }
.luna2[data-outfit="enterprise"] .l2-outfit-home { display:none; }
.luna2[data-outfit="enterprise"] .l2-outfit-enterprise { opacity:1; }
.luna2[data-outfit="enterprise"] .l2-sleeve { fill:#9981c3; }
.luna2[data-compact="true"] .l2-detail { display:none; }
.luna2[data-state="listening"] .l2-listening-lines { opacity:.85; }
.luna2[data-state="thinking"] .l2-thinking-dots { opacity:1; }
.luna2[data-state="thinking"] .l2-eye-gaze { transform:translate(3px,-4px); }
.luna2[data-state="thinking"] .l2-head-pose { transform:rotate(-4deg); }
.luna2[data-state="thinking"] .l2-arm-left { opacity:0; }
.luna2[data-state="thinking"] .l2-hand-think { opacity:1; }
.luna2[data-state="working"] .l2-laptop { opacity:1; }
.luna2[data-state="working"] .l2-eye-gaze { transform:translate(0,4px); }
.luna2[data-state="working"] .l2-arm { transform:rotate(-25deg); }
.luna2[data-state="happy"] .l2-eyes-open,
.luna2[data-state="sleeping"] .l2-eyes-open { opacity:0; }
.luna2[data-state="happy"] .l2-eyes-shut,
.luna2[data-state="happy"] .l2-sparkles { opacity:1; }
.luna2[data-state="happy"] .l2-mouth-smile,
.luna2[data-state="error"] .l2-mouth-smile { opacity:0; }
.luna2[data-state="happy"] .l2-mouth-wide { opacity:1; }
.luna2[data-state="error"] .l2-mouth-small,
.luna2[data-state="error"] .l2-oops,.luna2[data-state="error"] .l2-brows { opacity:1; }
.luna2[data-state="sleeping"] .l2-mouth-smile { opacity:0; }
.luna2[data-state="sleeping"] .l2-sleep-mask,
.luna2[data-state="sleeping"] .l2-zzz { opacity:1; }
.luna2[data-state="sleeping"] .l2-mouth-snore { opacity:1; }
.luna2[data-state="sleeping"] .l2-snore-open,
.luna2[data-state="sleeping"] .l2-snore-tongue { opacity:0; animation:l2-snore-open 3.6s steps(1,end) infinite; }
.luna2[data-state="sleeping"] .l2-snore-closed { opacity:1; animation:l2-snore-closed 3.6s steps(1,end) infinite; }
.luna2[data-state="talking"] .l2-mouth-smile { opacity:0; }
.luna2[data-state="talking"] .l2-mouth-small { opacity:1; }

/* Static proportions were raster-checked before motion was introduced. */
.luna2 .l2-character { animation:l2-breathe 5.6s ease-in-out infinite; }
.luna2 .l2-pigtail { animation:l2-hair 6.7s ease-in-out infinite; }
.luna2 .l2-head-pose,.luna2 .l2-eye-gaze,.luna2 .l2-arm { transition:transform 360ms ease; }
.luna2:not([data-state="sleeping"]):not([data-state="happy"]) .l2-eyes-open { animation:l2-blink-open 17s steps(1,end) infinite; }
.luna2:not([data-state="sleeping"]):not([data-state="happy"]) .l2-eyes-blink { animation:l2-blink-shut 17s steps(1,end) infinite; }
.luna2[data-state="listening"] .l2-pigtail { animation:l2-perk 3.8s ease-in-out infinite; }
.luna2[data-state="thinking"] .l2-thinking-dots circle { animation:l2-dot 1.8s ease-in-out infinite; }
.luna2[data-state="thinking"] .l2-thinking-dots circle:nth-child(2) { animation-delay:.25s; }
.luna2[data-state="thinking"] .l2-thinking-dots circle:nth-child(3) { animation-delay:.5s; }
.luna2[data-state="working"] .l2-arm { animation:l2-type .85s ease-in-out infinite; }
.luna2[data-state="working"] .l2-arm-right { animation-delay:.42s; }
.luna2[data-state="working"] .l2-eye-gaze { animation:l2-glance 7s ease-in-out infinite; }
.luna2[data-state="talking"][data-audio="unavailable"] .l2-mouth-small { animation:l2-mouth-a .64s steps(1,end) infinite; }
.luna2[data-state="talking"][data-audio="unavailable"] .l2-mouth-wide { animation:l2-mouth-b .64s steps(1,end) infinite; }
.luna2[data-state="talking"][data-audio="closed"] .l2-mouth-small { opacity:0; }
.luna2[data-state="talking"][data-audio="closed"] .l2-mouth-smile { opacity:1; }
.luna2[data-state="talking"][data-audio="wide"] .l2-mouth-small { opacity:0; }
.luna2[data-state="talking"][data-audio="wide"] .l2-mouth-wide { opacity:1; }
.luna2[data-state="happy"] .l2-character { animation:l2-celebrate .85s ease-out 1; }
.luna2[data-state="happy"] .l2-sparkles { animation:l2-sparkle 1.4s ease-out 1; }
.luna2[data-state="error"] .l2-mouth-small { animation:l2-surprise 1.1s steps(1,end) forwards; }
.luna2[data-state="error"] .l2-mouth-concern { animation:l2-concern 1.1s steps(1,end) forwards; }
.luna2[data-state="sleeping"] .l2-character { animation-duration:6.8s; }
.luna2[data-state="sleeping"] .l2-head-pose { animation:l2-sleep-bob 4.8s ease-in-out infinite; }
.luna2[data-state="sleeping"] .l2-zzz { animation:l2-drift 5s ease-in-out infinite; }
@keyframes l2-breathe { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-2px); } }
@keyframes l2-hair { 0%,100% { transform:rotate(0); } 50% { transform:rotate(1deg); } }
@keyframes l2-perk { 0%,100% { transform:rotate(3deg); } 50% { transform:rotate(4deg); } }
/* Unequal blink intervals (3.4, 5.3, 2.5, 5.8 seconds), no eye/face scaling. */
@keyframes l2-blink-open { 0%,21%,52%,67%,100% { opacity:1; } 20%,51%,66% { opacity:0; } }
@keyframes l2-blink-shut { 0%,21%,52%,67%,100% { opacity:0; } 20%,51%,66% { opacity:1; } }
@keyframes l2-dot { 0%,100% { opacity:.35; } 50% { opacity:1; } }
@keyframes l2-type { 0%,100% { transform:rotate(-25deg) translateY(0); } 50% { transform:rotate(-25deg) translateY(5px); } }
@keyframes l2-sleep-bob { 0%,100% { transform:translateY(0) rotate(0); } 50% { transform:translateY(1.5px) rotate(.6deg); } }
@keyframes l2-snore-open { 0%,28%,64%,100% { opacity:0; } 34%,58% { opacity:1; } }
@keyframes l2-snore-closed { 0%,28%,64%,100% { opacity:1; } 34%,58% { opacity:0; } }
@keyframes l2-glance { 0%,65%,100% { transform:translateY(4px); } 75%,90% { transform:translateY(0); } }
@keyframes l2-mouth-a { 0%,55%,100% { opacity:1; } 25%,75% { opacity:0; } }
@keyframes l2-mouth-b { 0%,55%,100% { opacity:0; } 25%,75% { opacity:1; } }
@keyframes l2-celebrate { 0%,65%,100% { transform:translateY(0); } 30% { transform:translateY(-7px); } 80% { transform:translateY(-2px); } }
@keyframes l2-sparkle { 0% { opacity:0; } 30%,70%,100% { opacity:1; } }
@keyframes l2-surprise { 0% { opacity:1; } 100% { opacity:0; } }
@keyframes l2-concern { 0% { opacity:0; } 100% { opacity:1; } }
@keyframes l2-drift { 0%,100% { opacity:.35; transform:translateY(0); } 50% { opacity:.9; transform:translateY(-7px); } }
.luna2[data-paused="true"] * { animation-play-state:paused !important; }
.luna2[data-reduced-motion="true"] * { animation:none !important; transition:none !important; }
@media (prefers-reduced-motion:reduce) { .luna2 * { animation:none !important; transition:none !important; } }
</style></svg>