[package]
name = "lunaos-home-preview"
version = "0.1.0"
description = "Offline fictional family draft review prototype"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "lunaos_home_preview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Security_Credentials_UI", "Win32_System_WinRT", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-future = "=0.3.2"
