name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: home-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on:
      group: home-public-untrusted
      labels: [self-hosted, linux, x64, home-pr-isolated]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
