name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: home-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require GitHub-hosted runner
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check OpenSSL CLI
        run: |
          command -v openssl
          openssl version
      - run: npm ci --ignore-scripts
      - run: npm test
  windows-grocery-probe:
    name: Windows grocery probe
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Require GitHub-hosted runner
        shell: pwsh
        run: if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Expected GitHub-hosted runner' }
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Record Windows probe runtime
        shell: pwsh
        run: |
          node --version
          pwsh --version
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
      - run: npm ci --ignore-scripts
      - name: Record Rust toolchain and build the snapshot store developer-harness worker
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          node scripts/build-snapshot-store.mjs
      - name: Snapshot store crate tests
        shell: pwsh
        run: node scripts/build-snapshot-store.mjs test
      - run: node --test test/windows-grocery-persistence.test.js test/versioned-store-conformance.test.js test/windows-snapshot-store.test.js test/windows-snapshot-session.test.js test/windows-notebook-persistence.test.js
