name: Home isolated test runner
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on:
      group: home-public-untrusted
      labels: [self-hosted, linux, x64, home-pr-isolated]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check OpenSSL CLI
        run: |
          command -v openssl
          openssl version
      - run: npm ci --ignore-scripts
      - run: npm test
