# Vigil automated PR review (F2iLLC/vigil), calling the shared reusable workflow.
#
# - Model: Claude (claude-sonnet-5-5), authenticated with Anthropic workload
#   identity federation: the run's GitHub OIDC token is exchanged for a
#   short-lived Anthropic token, so no API key is stored. This needs
#   `id-token: write` below and the org-level ANTHROPIC_* Actions variables
#   (ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
#   ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID).
# - Runner: GitHub-hosted. This repository is PUBLIC, so it must never run on
#   our self-hosted runners: a pull request from a fork could execute
#   arbitrary code on our servers.
# - Fork pull requests are rejected before the privileged reusable workflow.
#   Comment commands also require OWNER, MEMBER, or COLLABORATOR association.
#   A read-only API lookup verifies the head repository for every admitted event.
# - Kill switch: set the Actions variable VIGIL_SKIP=true to pause reviews.
# - The reusable workflow is pinned to a vigil commit; bump it deliberately.

name: Vigil PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    if: >-
      vars.VIGIL_SKIP != 'true' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
    steps:
      # No checkout or evaluation of PR/comment content in this read-only job.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: authorize
        with:
          script: |
            core.setOutput('allowed', 'false');
            const { eventName, payload, repo } = context;
            const isComment = ['issue_comment', 'pull_request_review_comment'].includes(eventName);
            if (eventName !== 'pull_request' && !isComment) return;
            if (isComment && !['OWNER', 'MEMBER', 'COLLABORATOR'].includes(payload.comment?.author_association)) return;
            if (eventName === 'issue_comment' && !payload.issue?.pull_request) return;
            const number = eventName === 'issue_comment' ? payload.issue.number : payload.pull_request?.number;
            if (!Number.isSafeInteger(number) || number <= 0) return;
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
            const expected = `${repo.owner}/${repo.repo}`;
            if (pr.state !== 'open' || pr.base?.repo?.full_name !== expected || pr.head?.repo?.full_name !== expected) return;
            core.setOutput('allowed', 'true');

  vigil:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true' && vars.VIGIL_SKIP != 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: F2iLLC/vigil/.github/workflows/reusable-vigil.yml@52826b70595baae8d16549a7503535c20820a4a0
    with:
      model: claude-sonnet-5-5
      runner-json: '["ubuntu-latest"]'
    secrets:
      VIGIL_REVIEW_TOKEN: ${{ secrets.VIGIL_REVIEW_TOKEN }}
